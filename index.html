<!DOCTYPE html>
<html>
  <head>
    <title>p5.js Collaborative Drawing</title>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Draw with your mouse! <br />
      Open in multiple tabs to test multiplayer.
    </div>

    <!-- Load p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>

    <!-- Load Socket.IO client from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js"></script>

    <!-- p5.js sketch -->
    <script>
      var socket = io();
let myPicker;
let slider;
let isEraserActive = false;
let banner;
let canvas;
let canvasX, canvasY;
function setup() 
{
  canvas = createCanvas(500, 500);
  background(245);

	// Listen for drawing events from other users
        socket.on("iamdrawing", someoneIsDrawing);

        // Listen for new user join notifications
        socket.on("hello!", someoneJoined);

        name = prompt("Name?");
        // player.debug = true;
        if (name == null || name == "") {
          name = "Player";
        }
        // Announce our presence to the server
        socket.emit("hello!", name);
  
  fill(255);
  let banner = rect(0,0,500,75);
  canvasX = canvas.position().x;
  canvasY = canvas.position().y;
  // setInterval(timeIt, 1000);
  
  myPicker = createColorPicker('black');
  myPicker.position(canvasX + 100,canvasY + 7);
  
  slider = createSlider(1, 10);
  slider.position(canvasX + 5,canvasY +  10);
  slider.size(80);
  
  // Create an eraser button
  let eraserButton = createButton('Eraser: OFF');
  eraserButton.position(canvasX + 10,canvasY +  45);
  eraserButton.mousePressed(toggleEraser);
  
  let clearButton = createButton('Clear');
  clearButton.position(canvasX + 435,canvasY +  10);
  clearButton.mousePressed(clearPress);
  
}

function draw() 
{
  console.log(mouseX)
  let o = myPicker.color();
  stroke(o);
  
  let p = slider.value();
  strokeWeight(p);
  
  if (mouseIsPressed && mouseY > 80) 
  {
    if (isEraserActive) 
    {
      // Erase by drawing with the background color
      stroke(245); // Assuming background is white
      line(pmouseX, pmouseY, mouseX, mouseY);
    } else 
    {
      // Draw a line using the color picker
      line(pmouseX, pmouseY, mouseX, mouseY);
    }
  }
	socket.emit("iamdrawing", pmouseX, pmouseY, mouseX, mouseY, p, name);
}

function toggleEraser() 
{
  isEraserActive = !isEraserActive;
  // Change the button text based on the state
  this.html(isEraserActive ? 'Eraser: ON' : 'Eraser: OFF');
}

function clearPress() {
  background(245);
  fill(255);
  strokeWeight(1);
  stroke(0);
  let banner = rect(0,0,500,75);
}

function someoneIsDrawing(x, y, r, name) {
    noStroke();
    fill(255, 0, 0, 90); // Red for other users
    ellipse(x, y, r, r);
    text(name, x, y);
}

function someoneJoined() {
    console.log("New user joined!");
}

    </script>
  </body>
</html>
